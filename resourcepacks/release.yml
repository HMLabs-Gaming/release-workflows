# Caller example: copy to the consuming resource-pack repository at .github/workflows/release.yml.
#
# Expected root meta.json:
# {
#   "version": "1.0.1",
#   "minecraft": {
#     "from": "1.13",
#     "to": "26.3"
#   }
# }
#
# meta.json is release metadata and is intentionally not included in the ZIP.
name: Resource Pack Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: example-resourcepack
      use-java: false
      loaders: resourcepack
      build-command: |
        bash .release-workflows/scripts/build-resourcepack.sh
      artifacts-json: '[{"path":"example-resourcepack-{version}.zip"}]'
    secrets: inherit
