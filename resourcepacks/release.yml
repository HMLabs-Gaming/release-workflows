# Caller example: copy to the consuming resource-pack repository at .github/workflows/release.yml.
name: Resource Pack Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: example-resourcepack
      use-java: false
      build-command: |
        version="\${GITHUB_REF_NAME#v}"
        zip -qr "resourcepack-\${version}.zip" pack.mcmeta assets pack.png
      artifacts-json: '[{"path":"resourcepack-{version}.zip"}]'
    secrets: inherit
