# Caller example: copy to the consuming resource-pack repository at .github/workflows/release.yml.
#
# Expected root meta.json:
# {
#   "version": "1.0.1",
#   "minecraft": {
#     "from": "1.13",
#     "to": "26.3"
#   }
# }
#
# meta.json is release metadata and is intentionally not included in the ZIP.
name: Resource Pack Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: example-resourcepack
      use-java: false
      build-command: |
        set -Eeuo pipefail

        version="$(python3 -c 'import json; print(json.load(open("meta.json", encoding="utf-8"))["version"])')"
        tag_version="${GITHUB_REF_NAME#v}"

        if [ "$version" != "$tag_version" ]; then
          echo "::error::meta.json version ($version) does not match the release tag ($tag_version)."
          exit 1
        fi

        zip -qr "example-resourcepack-${version}.zip" pack.mcmeta assets pack.png
      artifacts-json: '[{"path":"example-resourcepack-{version}.zip"}]'
    secrets: inherit
