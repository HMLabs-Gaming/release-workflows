# Caller example: copy to the consuming plugin repository at .github/workflows/release.yml.
name: Plugin Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: hmt-sync
      java-version: "25"
      build-command: |
        set -Eeuo pipefail
        version="${GITHUB_REF_NAME#v}"
        mkdir -p release-build
        mvn -B clean package -DskipTests -Pspigot
        cp target/hmt-sync-*-spigot.jar "release-build/hmt-sync-${version}-spigot.jar"
        mvn -B clean package -DskipTests -Pvelocity
        cp target/hmt-sync-*-velocity.jar "release-build/hmt-sync-${version}-velocity.jar"
        mvn -B clean package -DskipTests -Puniversal
        cp target/hmt-sync-*-universal.jar "release-build/hmt-sync-${version}-universal.jar"
      artifacts-json: '[{"path":"release-build/hmt-sync-{version}-spigot.jar","loader":"spigot"},{"path":"release-build/hmt-sync-{version}-velocity.jar","loader":"velocity"},{"path":"release-build/hmt-sync-{version}-universal.jar","loader":"universal"}]'
    secrets: inherit
