# Caller example: copy to the consuming plugin repository at .github/workflows/release.yml.
# Default example for a single Spigot plugin. Only add more artifacts/builds
# when the plugin actually supports separate platforms or produces separate JARs.
name: Plugin Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: example-plugin
      java-version: "25"
      build-command: |
        set -Eeuo pipefail
        version="${GITHUB_REF_NAME#v}"
        mkdir -p release-build
        mvn -B clean package -DskipTests -Pspigot
        cp "target/example-plugin-${version}-spigot.jar" "release-build/example-plugin-${version}-spigot.jar"
      artifacts-json: '[{"path":"release-build/example-plugin-{version}-spigot.jar","loader":"spigot"}]'
      # Optional: enable Hangar only if this plugin is published there.
      # Configure the files/platforms to match the variants supported by your plugin.
      # hangar-project-slug: example-plugin
      # hangar-channel: Release
      # hangar-files: '[{"path":"platform-assets/example-plugin-*-spigot.jar","platforms":["PAPER"]}]'
      # hangar-platform-dependencies: '{"PAPER":[">=1.21"]}'
    secrets: inherit
