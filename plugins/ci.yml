# Caller example: copy to the consuming plugin repository at .github/workflows/ci.yml.
name: Plugin CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/ci-java.yml@main
    with:
      java-version: "25"
      build-command: |
        set -Eeuo pipefail
        mkdir -p build-artifacts
        mvn -B clean package -DskipTests -Pspigot
        cp target/hmt-sync-*-spigot.jar build-artifacts/
        mvn -B clean package -DskipTests -Pvelocity
        cp target/hmt-sync-*-velocity.jar build-artifacts/
        mvn -B clean package -DskipTests -Puniversal
        cp target/hmt-sync-*-universal.jar build-artifacts/
      artifact-paths: |
        build-artifacts/*.jar
      artifact-name: plugin-builds
