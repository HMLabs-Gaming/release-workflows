# Example: publish external GitHub Release download links for separate platform JARs to Hangar.
# Copy this file to .github/workflows/release.yml in the consuming plugin repository.
name: Hangar Link Multi-JAR Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: HMLabs-Gaming/release-workflows/.github/workflows/release-artifacts.yml@main
    with:
      project-slug: example-plugin
      java-version: "25"
      build-command: |
        set -Eeuo pipefail
        version="${GITHUB_REF_NAME#v}"
        mkdir -p release-build

        mvn -B clean package -DskipTests -Ppaper
        cp "target/example-plugin-${version}-paper.jar" "release-build/example-plugin-${version}-paper.jar"

        mvn -B clean package -DskipTests -Pvelocity
        cp "target/example-plugin-${version}-velocity.jar" "release-build/example-plugin-${version}-velocity.jar"

      artifacts-json: '[{"path":"release-build/example-plugin-{version}-paper.jar","loader":"paper"},{"path":"release-build/example-plugin-{version}-velocity.jar","loader":"velocity"}]'

      hangar-project-slug: ExamplePlugin
      hangar-channel: Release
      # Neither JAR is uploaded to Hangar; each platform points to a GitHub Release asset.
      hangar-files: '[{"platforms":["PAPER"],"url":true,"externalUrl":"https://github.com/OWNER/REPOSITORY/releases/download/{tag}/example-plugin-{version}-paper.jar"},{"platforms":["VELOCITY"],"url":true,"externalUrl":"https://github.com/OWNER/REPOSITORY/releases/download/{tag}/example-plugin-{version}-velocity.jar"}]'
    secrets: inherit
