name: Discord Release Webhook

on:
  workflow_call:
    inputs:
      project-title:
        type: string
        required: true
      version:
        type: string
        required: true
      release-url:
        type: string
        required: true
      changelog:
        type: string
        required: false
        default: ""
      modrinth-project-id:
        type: string
        required: false
        default: ""
      curseforge-project-id:
        type: string
        required: false
        default: ""
      hangar-project-slug:
        type: string
        required: false
        default: ""
    secrets:
      DISCORD_WEBHOOK:
        required: true
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
      HANGAR_API_TOKEN:
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4
        with:
          repository: HMLabs-Gaming/release-workflows
          ref: main
          path: release-workflows
      - name: Send Discord release notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PROJECT_TITLE: ${{ inputs.project-title }}
          VERSION: ${{ inputs.version }}
          RELEASE_URL: ${{ inputs.release-url }}
          CHANGELOG: ${{ inputs.changelog }}
          MODRINTH_PROJECT_ID: ${{ inputs.modrinth-project-id }}
          CURSEFORGE_PROJECT_ID: ${{ inputs.curseforge-project-id }}
          HANGAR_PROJECT_SLUG: ${{ inputs.hangar-project-slug }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: python3 release-workflows/scripts/discord-release.py
