name: Reusable Release Artifact Builder

on:
  workflow_call:
    inputs:
      project-slug:
        description: Lowercase kebab-case artifact slug
        type: string
        required: true
      build-command:
        description: Trusted maintainer-configured command to build/export release files
        type: string
        required: true
      artifacts-json:
        description: JSON array of built paths and optional loader names
        type: string
        required: true
      workflow-ref:
        description: Ref of this repository containing the naming script; keep aligned with the reusable workflow ref
        type: string
        required: false
        default: main
      java-version:
        type: string
        required: false
        default: "25"
      use-java:
        type: boolean
        required: false
        default: true
      go-version:
        type: string
        required: false
        default: "1.22"
      use-go:
        type: boolean
        required: false
        default: false
      modrinth-project-id:
        description: Optional Modrinth project ID; leave empty to disable publishing
        type: string
        required: false
        default: ""
      curseforge-project-id:
        description: Optional CurseForge project ID; leave empty to disable publishing
        type: string
        required: false
        default: ""
      version-type:
        description: release, beta, or alpha
        type: string
        required: false
        default: release
      loaders:
        description: Newline-separated loader list for platform metadata
        type: string
        required: false
        default: ""
      game-versions:
        description: Newline-separated Minecraft game versions
        type: string
        required: false
        default: ""
      hangar-project-slug:
        description: Optional Hangar project slug; intended for plugin projects only
        type: string
        required: false
        default: ""
      hangar-channel:
        description: Hangar channel, e.g. Release, Beta, or Alpha
        type: string
        required: false
        default: Release
      hangar-files:
        description: Hangar action files JSON, with paths relative to the downloaded platform-assets directory
        type: string
        required: false
        default: ""
      hangar-platform-dependencies:
        description: JSON object of Hangar platform dependency versions
        type: string
        required: false
        default: "{}"
    secrets:
      MODRINTH_TOKEN:
        required: false
      CURSEFORGE_TOKEN:
        required: false
      HANGAR_API_TOKEN:
        required: false
      DISCORD_WEBHOOK:
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      detected-loaders: ${{ steps.pack-metadata.outputs.loaders }}
      detected-modrinth-loaders: ${{ steps.pack-metadata.outputs.modrinth-loaders }}
      detected-curseforge-loaders: ${{ steps.pack-metadata.outputs.curseforge-loaders }}
      detected-game-versions: ${{ steps.pack-metadata.outputs.game-versions }}
      hangar-platform-dependencies: ${{ steps.hangar-metadata.outputs.platform-dependencies }}
    steps:
      - name: Checkout the published release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Checkout reusable workflow scripts
        uses: actions/checkout@v4
        with:
          repository: HMLabs-Gaming/release-workflows
          ref: ${{ inputs.workflow-ref }}
          path: .release-workflows
          persist-credentials: false
      - name: Detect Minecraft loader and game versions
        id: pack-metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          loaders = []
          modrinth_loaders = []
          curseforge_loaders = []
          game_versions = []

          resource_metadata = Path("meta.json")
          if resource_metadata.is_file():
              data = json.loads(resource_metadata.read_text(encoding="utf-8"))
              minecraft = data.get("minecraft", {})
              minecraft_from = minecraft.get("from")
              minecraft_to = minecraft.get("to")
              if minecraft_from and minecraft_to:
                  game_versions = [f"[{minecraft_from},{minecraft_to}]"]
              elif minecraft_from:
                  game_versions = [str(minecraft_from)]
              loaders = ["minecraft"]
              modrinth_loaders = ["minecraft"]
              curseforge_loaders = ["resourcepack"]
              print(f"Detected resource-pack metadata from {resource_metadata}")

          properties = Path("gradle.properties")
          if not game_versions and properties.is_file():
              text = properties.read_text(encoding="utf-8")
              match = re.search(r"^\s*minecraft_version\s*=\s*([^\s#]+)", text, re.MULTILINE)
              if match:
                  game_versions = [match.group(1)]
                  loaders = ["fabric"]
                  modrinth_loaders = ["fabric"]
                  curseforge_loaders = ["fabric"]

          if not game_versions:
              fabric_metadata = Path("src/main/resources/fabric.mod.json")
              if fabric_metadata.is_file():
                  data = json.loads(fabric_metadata.read_text(encoding="utf-8"))
                  dependency = data.get("depends", {}).get("minecraft")
                  if isinstance(dependency, str):
                      match = re.search(r"\d+(?:\.\d+){1,3}", dependency)
                      if match:
                          game_versions = [match.group(0)]
                          loaders = ["fabric"]
                          modrinth_loaders = ["fabric"]
                          curseforge_loaders = ["fabric"]

          if not game_versions:
              candidates = [
                  Path("platforms/modrinth/pack.toml"),
                  Path("platforms/curseforge/pack.toml"),
                  Path("pack.toml"),
              ]
              pack = next((p for p in candidates if p.is_file()), None)
              if pack is not None:
                  with pack.open("rb") as f:
                      data = tomllib.load(f)
                  versions = data.get("versions", {})
                  known_loaders = ("fabric", "forge", "neoforge", "quilt", "liteloader", "modloader")
                  loaders = [name for name in known_loaders if versions.get(name)]
                  modrinth_loaders = loaders[:]
                  curseforge_loaders = loaders[:]
                  game_versions = [str(versions["minecraft"])] if versions.get("minecraft") else []
                  print(f"Detected Packwiz metadata from {pack}")

          if not game_versions:
              plugin_metadata = Path("src/main/resources/plugin.yml")
              if plugin_metadata.is_file():
                  text = plugin_metadata.read_text(encoding="utf-8")
                  match = re.search(r"^\s*api-version\s*:\s*[\"']?([^\"'\s#]+)", text, re.MULTILINE)
                  if match:
                      game_versions = [match.group(1)]
                      loaders = ["paper"]
                      modrinth_loaders = ["paper"]
                      curseforge_loaders = ["paper"]
                      print(f"Detected Paper plugin metadata from {plugin_metadata}")

          print(f"Detected loaders={loaders}, modrinth_loaders={modrinth_loaders}, curseforge_loaders={curseforge_loaders}, game_versions={game_versions}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, values in (("loaders", loaders), ("modrinth-loaders", modrinth_loaders), ("curseforge-loaders", curseforge_loaders), ("game-versions", game_versions)):
                  output.write(f"{key}<<DETECTED_{key.upper().replace('-', '_')}\n")
                  output.write("\n".join(values) + "\n")
                  output.write(f"DETECTED_{key.upper().replace('-', '_')}\n")
          PY
      - name: Read Hangar platform compatibility from plugin metadata
        id: hangar-metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          dependencies = {}
          paper_metadata = Path("src/main/resources/plugin.yml")
          if paper_metadata.is_file():
              text = paper_metadata.read_text(encoding="utf-8")
              match = re.search(r'^\s*api-version\s*:\s*["\']?([^"\'\s#]+)', text, re.MULTILINE)
              if match:
                  dependencies["PAPER"] = [match.group(1)]

          velocity_metadata = Path("src/main/resources/velocity-plugin.json")
          if velocity_metadata.is_file():
              data = json.loads(velocity_metadata.read_text(encoding="utf-8"))
              versions = data.get("supportedVelocityVersions", [])
              if isinstance(versions, str):
                  versions = [versions]
              if versions:
                  dependencies["VELOCITY"] = versions

          encoded = json.dumps(dependencies, separators=(",", ":"))
          print(f"Detected Hangar platform dependencies: {encoded}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"platform-dependencies={encoded}\n")
          PY
      - name: Set up Java
        if: inputs.use-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Set up Go
        if: inputs.use-go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - name: Run configured release build
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"
      - name: Prepare versioned and versionless assets
        shell: bash
        env:
          PROJECT_SLUG: ${{ inputs.project-slug }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          ARTIFACTS_JSON: ${{ inputs.artifacts-json }}
        run: bash .release-workflows/scripts/prepare-release-assets.sh
      - name: Attach every asset to this GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Upload versioned files for platform publishers
        uses: actions/upload-artifact@v4
        with:
          name: platform-publish-assets
          path: platform-assets/*
          if-no-files-found: error
          compression-level: 0

  publish-modrinth:
    needs: build-and-release
    if: inputs.modrinth-project-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download versioned release files
        uses: actions/download-artifact@v4
        with:
          name: platform-publish-assets
          path: platform-assets
      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: ${{ inputs.modrinth-project-id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: platform-assets/*
          name: ${{ github.event.release.name || github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ inputs.version-type }}
          loaders: ${{ inputs.loaders != '' && inputs.loaders || needs.build-and-release.outputs.detected-modrinth-loaders }}
          game-versions: ${{ inputs.game-versions != '' && inputs.game-versions || needs.build-and-release.outputs.detected-game-versions }}

  publish-curseforge:
    needs: build-and-release
    if: inputs.curseforge-project-id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download versioned release files
        uses: actions/download-artifact@v4
        with:
          name: platform-publish-assets
          path: platform-assets
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ inputs.curseforge-project-id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: platform-assets/*
          name: ${{ github.event.release.name || github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ inputs.version-type }}
          loaders: ${{ inputs.loaders != '' && inputs.loaders || needs.build-and-release.outputs.detected-curseforge-loaders }}
          game-versions: ${{ inputs.game-versions != '' && inputs.game-versions || needs.build-and-release.outputs.detected-game-versions }}

  publish-hangar:
    needs: build-and-release
    if: inputs.hangar-project-slug != '' && inputs.hangar-files != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download versioned release files
        uses: actions/download-artifact@v4
        with:
          name: platform-publish-assets
          path: platform-assets
      - name: Resolve Hangar external-link placeholders
        id: hangar-files
        shell: bash
        env:
          HANGAR_FILES_JSON: ${{ inputs.hangar-files }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          version = re.sub(r"^v", "", tag)
          files = json.loads(os.environ["HANGAR_FILES_JSON"])
          for item in files:
              for key in ("path", "externalUrl"):
                  if key in item:
                      item[key] = item[key].replace("{tag}", tag).replace("{version}", version)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("json<<HANGAR_FILES_JSON\n")
              output.write(json.dumps(files, separators=(",", ":")) + "\n")
              output.write("HANGAR_FILES_JSON\n")
          PY
      - name: Publish plugin to Hangar
        uses: HMLabs-Gaming/Hangar-Publish@v2.3.0
        with:
          api_token: ${{ secrets.HANGAR_API_TOKEN }}
          slug: ${{ inputs.hangar-project-slug }}
          version: ${{ github.event.release.tag_name }}
          channel: ${{ inputs.hangar-channel }}
          description: ${{ github.event.release.body }}
          files: ${{ steps.hangar-files.outputs.json }}
          platform_dependencies: ${{ needs.build-and-release.outputs.hangar-platform-dependencies != '' && needs.build-and-release.outputs.hangar-platform-dependencies || inputs.hangar-platform-dependencies }}

  discord-release:
    needs:
      [build-and-release, publish-modrinth, publish-curseforge, publish-hangar]
    if: >-
      always() &&
      needs.build-and-release.result == 'success' &&
      (needs.publish-modrinth.result == 'success' || needs.publish-modrinth.result == 'skipped') &&
      (needs.publish-curseforge.result == 'success' || needs.publish-curseforge.result == 'skipped') &&
      (needs.publish-hangar.result == 'success' || needs.publish-hangar.result == 'skipped')
    uses: HMLabs-Gaming/release-workflows/.github/workflows/discord-webhook.yml@main
    with:
      project-title: ${{ github.event.release.name || inputs.project-slug }}
      version: ${{ github.event.release.tag_name }}
      release-url: ${{ github.event.release.html_url }}
      changelog: ${{ github.event.release.body }}
      modrinth-project-id: ${{ inputs.modrinth-project-id }}
      curseforge-project-id: ${{ inputs.curseforge-project-id }}
      hangar-project-slug: ${{ inputs.hangar-project-slug }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
